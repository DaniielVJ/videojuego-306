{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}" />
    <link rel="alternate icon" href="{% static 'img/favicon.svg' %}" />
    <title>
    {% block title %}
        
    {% endblock title %}
        </title>

    
    <!-- Tipografías Épicas Globales (World of Warcraft / Medieval) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=MedievalSharp&display=swap" rel="stylesheet" />

    <!-- Estilos Base Globales (Variables y Scrollbar Temático) -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />

    {% block styles %}
        
    {% endblock styles %}
        
</head>
<body>
    
    
    {% block main %}
        
    {% endblock main %}
        

    
    {% block scripts %}
        
    {% endblock scripts %}
        
</body>
</html>
