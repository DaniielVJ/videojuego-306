{% extends 'base.html' %}

{% block content %}
  <!-- El título es dinámico o puedes cambiarlo según la vista -->
  <h2>Listado General</h2>
  
  <a href="{{ url_crear }}">Crear Nuevo Registro</a>
  <br><br>

  <table border="1">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- 'object_list' es el nombre por defecto que usa ListView si no defines context_object_name -->
      {% for item in object_list %}
        <tr>
          <td>{{ item.nombre }}</td>
          <td>{{ item.descripcion }}</td>
          <td>
             <a href="{% url url_editar item.id %}">Editar</a> | 
             <a href="{% url url_eliminar item.id %}">Borrar</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">No hay registros activos disponibles.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
