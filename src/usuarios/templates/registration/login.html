{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <meta name="description" content="Página de inicio de sesión con estética pixel art retro."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=MedievalSharp&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/login.css' %}"/> 
</head>
<body>

  <div class="scene">

    <!-- Pixel art canvas background -->
    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <!-- Contenido principal -->
    <div class="content">

      <h1 class="main-title">&lt;TITULO INGENIOSO&gt;</h1>

      <div class="login-panel">
        <h2 class="login-heading">INICIAR SESION</h2>

        <form id="loginForm" class="login-form" novalidate action="" method="POST">
        {% csrf_token %}
          <div class="field-wrap">
            <span class="field-label">NOMBRE:</span>
            {{form.username}}
          </div>

          <div class="field-wrap">
            <span class="field-label">CONTRASEÑA:</span>
            {{form.password}}
          </div>

          <button type="submit" id="submitBtn" class="btn-login">INICIAR SESION</button>
          <a href="#" id="registerLink" class="register-link">REGISTRARSE</a>
                            {% if messages %}
                        
                        {% for message in messages %}    
                            <div id="login-error" class="login-error">
                                <span>{{message}}</span>
                            </div>
                        {% endfor %}
                            
                    {% endif %}
        </form>
      </div>

    </div><!-- /content -->
  </div><!-- /scene -->

  <script src="{%static 'js/login.js'%}"></script>
</body>
</html>
