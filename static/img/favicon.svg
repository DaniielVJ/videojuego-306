<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Degradado del Escudo -->
    <radialGradient id="shieldGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3d2812"/>
      <stop offset="60%" stop-color="#1c1106"/>
      <stop offset="100%" stop-color="#0a0603"/>
    </radialGradient>

    <!-- Degradado del Borde Dorado -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe270"/>
      <stop offset="50%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#8c6214"/>
    </linearGradient>

    <!-- Degradado Espadas de Acero Legendario -->
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d9e6f2"/>
      <stop offset="80%" stop-color="#7a8c9e"/>
      <stop offset="100%" stop-color="#3b4854"/>
    </linearGradient>

    <!-- Resplandor Gema Carmesí -->
    <radialGradient id="rubyGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="45%" stop-color="#e60000"/>
      <stop offset="85%" stop-color="#7a0000"/>
      <stop offset="100%" stop-color="#330000"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#ffcc00" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo Escudo Medieval -->
  <path d="M32 3 C48 3, 58 7, 58 17 C58 40, 44 55, 32 61 C20 55, 6 40, 6 17 C6 7, 16 3, 32 3 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldBorder)" 
        stroke-width="3" 
        filter="url(#glow)"/>

  <!-- Borde interior fino -->
  <path d="M32 7 C45 7, 53 10, 53 18 C53 37, 41 49, 32 55 C23 49, 11 37, 11 18 C11 10, 19 7, 32 7 Z" 
        fill="none" 
        stroke="#5a3e13" 
        stroke-width="1.2" 
        opacity="0.9"/>

  <!-- Espadas Cruzadas de Fondo -->
  <!-- Espada 1 (Diagonal Izquierda a Derecha) -->
  <g transform="rotate(45 32 30)">
    <!-- Hoja -->
    <path d="M30.5 8 L32 4 L33.5 8 L33.5 38 L30.5 38 Z" fill="url(#steelBlade)"/>
    <line x1="32" y1="6" x2="32" y2="38" stroke="#ffffff" stroke-width="0.75" opacity="0.8"/>
    <!-- Guardia -->
    <rect x="25" y="38" width="14" height="2.5" rx="1" fill="url(#goldBorder)"/>
    <!-- Mango -->
    <rect x="30.5" y="40.5" width="3" height="7" rx="0.5" fill="#4a1505"/>
    <!-- Pomo -->
    <circle cx="32" cy="49" r="2.2" fill="url(#goldBorder)"/>
  </g>

  <!-- Espada 2 (Diagonal Derecha a Izquierda) -->
  <g transform="rotate(-45 32 30)">
    <!-- Hoja -->
    <path d="M30.5 8 L32 4 L33.5 8 L33.5 38 L30.5 38 Z" fill="url(#steelBlade)"/>
    <line x1="32" y1="6" x2="32" y2="38" stroke="#ffffff" stroke-width="0.75" opacity="0.8"/>
    <!-- Guardia -->
    <rect x="25" y="38" width="14" height="2.5" rx="1" fill="url(#goldBorder)"/>
    <!-- Mango -->
    <rect x="30.5" y="40.5" width="3" height="7" rx="0.5" fill="#4a1505"/>
    <!-- Pomo -->
    <circle cx="32" cy="49" r="2.2" fill="url(#goldBorder)"/>
  </g>

  <!-- Gema de Poder Central (Rubí Épico) -->
  <polygon points="32,21 39,29 32,37 25,29" 
           fill="url(#rubyGlow)" 
           stroke="url(#goldBorder)" 
           stroke-width="1.8"/>

  <!-- Brillo de la Gema -->
  <polygon points="32,23 35,27 32,30 29,27" 
           fill="#ffffff" 
           opacity="0.5"/>
</svg>
